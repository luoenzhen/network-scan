name: Build NetScan iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package NetScan IPA
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Run Regression Tests
        run: |
          python3 Scripts/test_project.py
          plutil -lint NetScan/NetScan.xcodeproj/project.pbxproj
          swift test
          swift test -c release

      - name: Check Thread Safety
        run: swift test --sanitize=thread --scratch-path .build/tsan

      - name: Test Device Detail in iOS Simulator
        timeout-minutes: 15
        run: bash Scripts/run_ui_tests.sh

      - name: Archive iOS App
        run: |
          mkdir -p build/Payload
          
          xcodebuild archive \
            -project NetScan/NetScan.xcodeproj \
            -scheme NetScan \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/NetScan.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          if strings build/NetScan.xcarchive/Products/Applications/NetScan.app/NetScan | grep NETSCAN_UI_TESTING > /dev/null; then
            echo "UI test fixture must not be present in the Release executable."
            exit 1
          fi

      - name: Package Payload into IPA
        run: |
          python3 Scripts/package_ipa.py build/NetScan.xcarchive/Products/Applications/NetScan.app --output build/NetScan.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetScan-ipa
          path: build/NetScan.ipa
          if-no-files-found: error

      - name: Upload UI Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NetScan-ui-test-results
          path: build/UITestResults-*.xcresult
          if-no-files-found: ignore
